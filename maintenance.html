<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maintenance — Nolan Bernard</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .maintenance-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    .maintenance-content {
      max-width: 700px;
      margin: 0 auto;
    }

    .maintenance-logo {
      max-width: 180px;
      margin-bottom: 60px;
    }

    .maintenance-content h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1;
      margin-bottom: 28px;
    }

    .maintenance-content p {
      font-size: 1.2rem;
      line-height: 1.7;
      max-width: 520px;
      margin: 0 auto;
    }

    .maintenance-signature {
      margin-top: 50px !important;
      font-size: 1rem !important;
      opacity: 0.6;
    }
  </style>
</head>

<body>

  <main class="maintenance-page">

    <div class="maintenance-content">

      <img
        src="assets/logo-black.png"
        alt="Nolan Bernard"
        class="maintenance-logo"
      >

      <h1 id="maintenance-title">
        Je retravaille quelques détails.
      </h1>

      <p id="maintenance-message">
        Le site revient rapidement.
      </p>

      <p class="maintenance-signature">
        — Nolan
      </p>

    </div>

  </main>

  <script>
    fetch("content/settings.json?cache=" + Date.now())
      .then(response => response.json())
      .then(settings => {

        if (settings.maintenanceTitle) {
          document.getElementById("maintenance-title").textContent =
            settings.maintenanceTitle;
        }

        if (settings.maintenanceMessage) {
          document.getElementById("maintenance-message").textContent =
            settings.maintenanceMessage;
        }

        if (!settings.maintenance) {
          window.location.replace("index.html");
        }

      })
      .catch(error => {
        console.error("Erreur chargement maintenance :", error);
      });
  </script>

</body>
</html>
