<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Articles — Nolan Bernard</title>

  <meta
    name="description"
    content="Des idées, des expériences et parfois des contradictions. Les articles de Nolan Bernard."
  >

  <link rel="icon" href="assets/favicon.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="site-header" data-header>

    <div class="shell header-inner">

      <a
        class="brand"
        href="index.html"
        aria-label="Accueil Nolan Bernard"
      >

        <img
          src="assets/logo-black.png"
          alt="Logo Nolan Bernard"
          class="brand-logo"
        >

        <span class="brand-wordmark">
          NOLAN BERNARD
        </span>

      </a>

      <button
        class="menu-toggle"
        type="button"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="main-nav"
        data-menu-toggle
      >
        <span></span>
        <span></span>
      </button>

      <nav
        class="main-nav"
        id="main-nav"
        aria-label="Navigation principale"
        data-nav
      >

        <a href="articles.html" aria-current="page">
          Articles
        </a>

        <a href="a-propos.html">
          À propos
        </a>

      </nav>

    </div>

  </header>


  <main>

    <section class="page-intro shell">

      <p class="eyebrow">
        Écrits
      </p>

      <h1>
        Articles
      </h1>

      <p>
        Des idées, des expériences et parfois des contradictions.
      </p>

    </section>


    <section class="archive shell">

      <div class="archive-tools">

        <div class="filter-group">

          <button
            class="filter-btn is-active"
            type="button"
            data-dynamic-filter="all"
          >
            Tous
          </button>

          <button
            class="filter-btn"
            type="button"
            data-dynamic-filter="Entreprendre"
          >
            Entreprendre
          </button>

          <button
            class="filter-btn"
            type="button"
            data-dynamic-filter="Psychologie"
          >
            Psychologie
          </button>

          <button
            class="filter-btn"
            type="button"
            data-dynamic-filter="Réflexions"
          >
            Réflexions
          </button>

        </div>


        <div class="search-field">

          <label class="sr-only" for="dynamic-search">
            Rechercher un article
          </label>

          <input
            type="search"
            id="dynamic-search"
            placeholder="Rechercher..."
          >

        </div>

      </div>


      <p
        class="archive-count"
        id="dynamic-article-count"
      >
        Chargement des articles...
      </p>


      <div
        class="archive-list"
        id="dynamic-article-list"
      ></div>


      <p
        class="empty-state"
        id="dynamic-empty-state"
        hidden
      >
        Aucun article ne correspond à votre recherche.
      </p>

    </section>

  </main>


  <footer class="site-footer">

    <div class="shell footer-grid">

      <div>

        <a
          class="footer-brand"
          href="index.html"
        >

          <img
            src="assets/logo-white.png"
            alt="Logo Nolan Bernard"
          >

          <span>
            NOLAN BERNARD
          </span>

        </a>

        <p>
          J'écris pour comprendre.
        </p>

      </div>


      <div class="footer-links">

        <a href="articles.html">
          Articles
        </a>

        <a href="a-propos.html">
          À propos
        </a>

      </div>


      <div class="footer-bottom">

        <span>
          © <span data-year></span> Nolan Bernard
        </span>

      </div>

    </div>

  </footer>


  <script src="script.js" defer></script>

</body>

</html>
